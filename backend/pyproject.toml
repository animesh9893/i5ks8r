[project]
name = "wind-forecast-api"
version = "0.1.0"
description = "API for GB national wind forecast monitoring (Elexon BMRS FUELHH + WINDFOR)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
